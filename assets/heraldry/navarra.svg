<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Arms of Navarre: gules, a cross, saltire and double orle of chains Or,
       a centre point vert. The chains are drawn as dashed strokes, which is
       what makes this reproducible without drawing a single link by hand. -->
  <defs>
    <clipPath id="shield">
      <path d="M8,8 H192 V140 C192,198 100,232 100,232 C100,232 8,198 8,140 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shield)">
    <rect width="200" height="240" fill="#9c2b1b"/>
    <g stroke="#c9a227" stroke-width="8" stroke-dasharray="10 6" stroke-linecap="round" fill="none">
      <line x1="100" y1="0" x2="100" y2="240"/>
      <line x1="0" y1="110" x2="200" y2="110"/>
      <line x1="0" y1="0" x2="200" y2="220"/>
      <line x1="200" y1="0" x2="0" y2="220"/>
      <circle cx="100" cy="110" r="64"/>
      <circle cx="100" cy="110" r="88"/>
    </g>
    <circle cx="100" cy="110" r="14" fill="#2e7d55" stroke="#c9a227" stroke-width="5"/>
  </g>
  <path d="M8,8 H192 V140 C192,198 100,232 100,232 C100,232 8,198 8,140 Z"
        fill="none" stroke="#2b2118" stroke-width="6"/>
</svg>
