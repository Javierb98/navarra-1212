    <path d="M58,180 L58,104 A42,46 0 0 1 142,104 L142,180"
          fill="none" stroke="#e8dcc0" stroke-width="15"/>
    <circle cx="100" cy="52" r="15" fill="#c9a227"/>
  </g>
  <path d="M8,8 H192 V140 C192,198 100,232 100,232 C100,232 8,198 8,140 Z"
